<style>
:root{--bg:#f3f4fa;--card:#fff;--tx:#10133a;--mut:#5d6290;--pri:#020780;--prit:#fff;--acc:#fd7004;--ok:#1f8a4c;--red:#c0392b;--amb:#b45309;--bd:#dcdef0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050733;--card:#0c1050;--tx:#eef0ff;--mut:#9aa0d8;--pri:#fd7004;--prit:#1a0b00;--acc:#fd7004;--ok:#4cd08a;--red:#ff7b6b;--amb:#ffb259;--bd:#1d2380;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050733;--card:#0c1050;--tx:#eef0ff;--mut:#9aa0d8;--pri:#fd7004;--prit:#1a0b00;--acc:#fd7004;--ok:#4cd08a;--red:#ff7b6b;--amb:#ffb259;--bd:#1d2380;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
.w{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:0 0 2px}h2{font-size:15px;margin:18px 0 8px}
.sub{color:var(--mut);font-size:13px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.k{font-size:12px;color:var(--mut)}.v{font-size:19px;font-weight:700}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.r2{grid-template-columns:1fr}}
button{font:inherit;border:0;border-radius:9px;padding:9px 13px;background:var(--pri);color:var(--prit);font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.d{background:transparent;color:var(--red);border:1px solid var(--bd)}
a.b{display:inline-block;text-decoration:none;border-radius:9px;padding:9px 13px;background:#1f9d55;color:#fff;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.late{color:var(--red)}.soon{color:var(--amb)}.ok{color:var(--ok)}
nav{overflow-x:auto;position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1 0 auto;min-width:74px;background:transparent;color:var(--mut);border-radius:0;padding:13px 4px;font-size:13px}
nav button.on{color:var(--pri);color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.p{display:flex;justify-content:space-between;gap:6px;padding:7px 0;border-top:1px solid var(--bd);font-size:13px;align-items:center}
details summary{cursor:pointer;color:var(--mut);font-size:13px;margin-top:6px}
#m{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#m>div{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
a.b.sm,.sm{padding:7px 11px;font-size:13px}
.c[data-a=go]{cursor:pointer}.c[data-a=go]:active{border-color:var(--acc)}
#st{background:var(--amb);color:#000;padding:6px 12px;font-size:12px;display:none;text-align:center}
.ch{display:flex;gap:4px}.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.bc span{font-size:10px;color:var(--mut);margin-top:3px}
.bars{display:flex;align-items:flex-end;gap:1px;height:100px;width:100%}.bars i{flex:1;background:var(--bd);display:block;border-radius:2px 2px 0 0}
.bs{flex:1;display:flex;flex-direction:column;justify-content:flex-end}.bars u{display:block;text-decoration:none;border-radius:2px 2px 0 0}.bn{background:var(--pri)}.bg{border:1px dashed var(--acc);border-bottom:0}
.bars i,.bars u{transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*45ms)}
@keyframes grow{from{transform:scaleY(0)}}@keyframes fill{from{width:0}}@keyframes pulse{50%{transform:scale(1.25) rotate(-8deg)}}
.tro{display:inline-block;animation:pulse 1.6s infinite}
body{padding-bottom:20px}.w{max-width:920px}
#sb{position:fixed;top:0;left:0;bottom:0;width:230px;background:#020780;color:#fff;display:flex;flex-direction:column;padding:14px 10px;padding-top:calc(14px + env(safe-area-inset-top,0px));z-index:6;overflow:auto;transition:transform .25s;border-right:4px solid #fd7004}
#sb .lg{width:100%;border-radius:10px;margin-bottom:14px}
#nav button{display:block;width:100%;text-align:left;background:transparent;color:#dfe3ff;border-radius:9px;padding:12px 14px;margin-bottom:2px}
#nav button.on{background:#ffffff1f;color:#fff;box-shadow:inset 3px 0 0 #fd7004}
#who{margin-top:auto;font-size:12px;color:#b9c0f5;padding:10px 6px}
#tb{display:none}
body.app{padding-left:230px}
body:not(.app) #sb,body:not(.app) #tb,body:not(.app) .w{display:none}
@media(max-width:799px){body.app{padding-left:0;padding-top:calc(52px + env(safe-area-inset-top,0px))}#sb{transform:translateX(-100%)}#sb.open{transform:none;box-shadow:0 0 40px #0008}
#tb{display:flex;position:fixed;top:0;left:0;right:0;height:calc(52px + env(safe-area-inset-top,0px));align-items:center;gap:10px;background:#020780;color:#fff;padding:env(safe-area-inset-top,0px) 12px 0;z-index:5;border-bottom:3px solid #fd7004}
#tb button{background:transparent;color:#fff;font-size:22px;padding:4px 10px}}
#lg{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#020780 0%,#0a24c9 55%,#fd7004 170%);overflow:hidden}
#lg:before,#lg:after{content:'';position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:fl 9s ease-in-out infinite alternate}
#lg:before{width:340px;height:340px;background:#fd7004;left:-90px;top:-80px}#lg:after{width:300px;height:300px;background:#3b5bff;right:-80px;bottom:-60px;animation-delay:-4s}
@keyframes fl{to{transform:translate(40px,30px) scale(1.15)}}@keyframes up{from{opacity:0;transform:translateY(20px)}}
#lc{position:relative;z-index:1;width:100%;max-width:380px;background:#fffffff2;color:#10133a;border-radius:20px;padding:22px;box-shadow:0 20px 60px #0006;animation:up .6s ease both}
#lc .lg{width:100%;border-radius:12px;margin-bottom:12px}#lc h2{margin:6px 0 12px;text-align:center}

<script>
const $=s=>document.querySelector(s);
const fmt=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const br=s=>s.split('-').reverse().join('/');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const addM=(s,k)=>{const[y,m,d]=s.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+k,1));const l=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,l));return t.toISOString().slice(0,10)};
const MULTA=.02,MORA=.01; // multa 2% + mora 1% ao mês (pro rata)
window.addEventListener('unhandledrejection',()=>{try{flash('Uma ação não foi salva. Confira a conexão e tente de novo.')}catch(_){}});
let sb=null,db=null,clients=[],loans=[],tab='painel',loaded=0,ff='Todos',W={},AG=[],CFG={meta:0},FN={},MIG=0,IU=[],LA=[],CA=[],me=null,adm=false,myId=null,viewAg='',U=null,canAdm=false,SES=null,ready=0,LOGO='',lk='';
SES=null;try{localStorage.removeItem('bc_s')}catch(_){}

function pmt(P,t,n,tipo){const i=t/100;P=P*Math.pow(1+i,(CAR-30)/30);if(tipo==='price')return i?P*i/(1-Math.pow(1+i,-n)):P/n;return P*(1+i*n)/n}
function gerar(P,t,n,tipo,p1){const v=Math.round(pmt(P,t,n,tipo)*100)/100;return Array.from({length:n},(_,k)=>({n:k+1,venc:addM(p1,k),valor:v,pago:null}))}
function enc(p,data){if(p.pago)return{dias:0,multa:0,mora:0,corr:0,total:p.valor};const J=(CFG&&CFG.juros)||{},mu=(J.multa??2)/100,mo=(J.mora??1)/100,co=(J.corr??0)/100,dias=dd(data||hoje(),p.venc);if(dias<=0)return{dias,multa:0,mora:0,corr:0,total:p.valor};const multa=p.valor*mu,corr=p.valor*co*dias/30,mora=J.modo==='comp'?p.valor*(Math.pow(1+mo,dias/30)-1):p.valor*mo/30*dias;return{dias,multa,mora,corr,total:p.valor+multa+mora+corr}}
const newRev=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function revOk(col,o){try{const d=await db.collection(col).doc(String(o.id)).get();const cur=d&&(typeof d.data==='function'?d.data():(d.data||d));if(cur&&cur.rev&&o.rev&&cur.rev!==o.rev){flash('Este registro foi alterado por outra pessoa enquanto você editava. Recarregue a tela e refaça a alteração.');return false}}catch(e){}return true}
const save=async l=>{if(!(await revOk('loans',l)))return false;l.rev=newRev();await db.collection('loans').doc(l.id).set(l);return true};

function open_(){const out=[];loans.filter(l=>ativo(l)&&own(l)).forEach(l=>l.parcelas.forEach(p=>{if(!p.pago)out.push({l,p,e:enc(p)})}));VD.filter(v=>cidOf(v.produto)&&v.status!=='Cancelado'&&Array.isArray(v.parcelas)&&v.parcelas.length).forEach(v=>{const l=vendaComoLoan('v'+v.id);if(l)l.parcelas.forEach(p=>{if(!p.pago)out.push({l,p,e:enc(p)})})});return out}

function EC_(){return `<div class='bt' style='margin-bottom:8px'>${tabs().some(t=>t[0]==='emp')?`<button class='sm ${tab==='emp'?'':'s'}' data-a='tab' data-k='emp'>📄 Empréstimos</button>`:''}${tabs().some(t=>t[0]==='cli')?`<button class='sm ${tab==='cli'?'':'s'}' data-a='tab' data-k='cli'>👥 Clientes</button>`:''}</div>`}
function greet(){const e=$('#hi');if(!e)return;if(!SES||!me){e.innerHTML='';return}const d=new Date();e.innerHTML='Seja bem-vindo, <b>'+esc(me.nome||'Agente')+'</b><br>'+d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})+' · '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
setInterval(greet,30000);
function render(){greet();if(!gate())return;setTimeout(czInit,0);BANCOS=bancosList();if(adm&&!MIG&&(FN.orc||FN.cr||FN.caixa0||FN.dcl||FN.fin_g)){MIG=1;migrateFin()}setTimeout(cu,0);if(!tabs().some(t=>t[0]===tab))tab=tabs()[0][0];
 $('#nav').innerHTML=tabs().filter(([k])=>k!=='cli').map(([k,t])=>`<button class="${tab===k||(k==='emp'&&tab==='cli')?'on':''}" data-a="tab" data-k="${k}">${t}</button>`).join('');

 if(tab==='painel'){const o=open_(),atr=o.filter(x=>x.e.dias>0),hj=o.filter(x=>x.e.dias===0);

  A.innerHTML=`${painelVisual()}${dash()}<h2>Resumo (toque para abrir)</h2><div class='g'>
  <div class='c' data-a='dt' data-m='emp'><div class='k'>Total emprestado ›</div><div class='v'>${fmt(emp)}</div></div>

document.addEventListener('input',e=>{const t=e.target;if(!t||t.tagName!=='INPUT'||t.type!=='text')return;if(t.dataset.mask||t.dataset.keep)return;if(/mail|pix|tel|cpf|cnpj|cep|rg|nasc|renda|valor|taxa|juros|prazo|num|conta|agencia|senha|cel|pw|pass|_p$|^p_?pw|login|usu|user|cod|acess/i.test(((t.id||'')+' '+(t.name||'')+' '+(t.dataset.f||'')+' '+(t.placeholder||'')+' '+(t.autocomplete||''))))return;if(t.closest&&t.closest('#lg,#lc,#login,#gate'))return;const u=t.value.toUpperCase();if(u!==t.value){const p=t.selectionStart;t.value=u;try{t.setSelectionRange(p,p)}catch(_){}}},true);
function cpfOk(c){const d=String(c||'').replace(/\D/g,'');if(d.length!==11||/^(\d)\1{10}$/.test(d))return false;let s=0;for(let i=0;i<9;i++)s+=+d[i]*(10-i);let r=(s*10)%11;if(r===10)r=0;if(r!==+d[9])return false;s=0;for(let i=0;i<10;i++)s+=+d[i]*(11-i);r=(s*10)%11;if(r===10)r=0;return r===+d[10]}
function cpfFmt(c){const d=String(c||'').replace(/\D/g,'');return d.length===11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):c}
let RGPEND=null;let PHOTO=null;
function fotoBlock(){return `<div><b style='font-size:12px'>Foto do cliente *</b><div id='pfbox' style='margin:6px 0;width:150px;aspect-ratio:3/4;border:1px solid #000;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f6f6f6'>${PHOTO?`<img src='${PHOTO}' alt='' style='width:100%;height:100%;object-fit:cover;object-position:center top;display:block'>`:`<span class='sub' style='margin:0'>Sem foto</span>`}</div><input type='file' id='pfoto' accept='image/*' style='width:150px;font-size:11px'><div class='sub' style='margin-top:4px'>Opcional. Aparece no contrato.</div></div>`}
function fotoDataUri(f){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const W=150,H=200,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');const sc=Math.max(W/im.width,H/im.height);const dw=im.width*sc,dh=im.height*sc;g.drawImage(im,(W-dw)/2,(H-dh)*0.25,dw,dh);res(cv.toDataURL('image/jpeg',0.85))};im.src=r.result};r.readAsDataURL(f)})}

<script>
const GUIDE='Você é o assistente do sistema BahiaCred, de correspondente de crédito consignado. Abas: Painel (indicadores), CRM (funil de leads), Ligações, Mailing, Vendas (propostas e vendas por promotora, com benefício, espécie, banco, status, valor vendido e valor pago ao cliente), Cobranças, Empréstimos (simulação, proposta e formalização do contrato), Clientes (cadastro com CEP que busca o endereço quando o navegador permite), Relatório, Gestão à Vista (metas), Despesas, Financeiro, Consolidado, Auditoria (histórico de alterações), Validação, Equipe (agentes e comissões), Minha conta. Editar e excluir venda ficam nos cards da aba Vendas. Excluir venda tira ela dos totais e comissões, mas continua na Auditoria.';
(async()=>{
 const b=document.getElementById('bot'),p=document.getElementById('botp'),q=document.getElementById('botq'),go=document.getElementById('botgo'),an=document.getElementById('botans');
 let sample=null;
 try{sample=window.claude?await claude.use('sample'):null}catch(_){}
 if(!sample)return;
 b.hidden=false;
 b.onclick=()=>{p.hidden=!p.hidden;if(!p.hidden)q.focus()};
 go.onclick=async()=>{
  const question=q.value.trim();if(!question)return;
  const t=(typeof TABS!=='undefined'&&typeof tab!=='undefined'&&(TABS.find(x=>x[0]===tab)||[])[1])||'';
  const prompt=GUIDE+'\n\nAba aberta agora: '+t+'\n\nPergunta do usuário: '+question+'\n\nResponda em português, curto e prático, com os passos na tela. Se não souber, diga que não sabe. Não invente valores nem dados de clientes.';
  an.textContent='Pensando...';go.disabled=true;
  try{await sample(prompt,{onText:({text})=>{an.textContent=text}})}catch(e){an.textContent=e&&e.code==='rate_limited'?'Muitas perguntas seguidas. Espere um pouco.':'Não consegui responder agora.'}
  go.disabled=false;
 };
})();
</script>
