<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>BahiaCred - Entrar</title>
<style>
:root{--bg:#f3f4fa;--card:#fff;--tx:#10133a;--mut:#5d6290;--pri:#020780;--prit:#fff;--acc:#fd7004;--red:#c0392b;--bd:#dcdef0;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--pri);border-bottom:4px solid var(--acc);padding:18px 0;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.top img{height:56px;border-radius:10px}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding-block:28px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:380px;padding:22px}
h1{font-size:18px;margin:0 0 4px;color:var(--pri)}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px;font-weight:600}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--bd);border-radius:9px;background:#fff;color:var(--tx)}
input:focus{outline:2px solid var(--pri);outline-offset:0;border-color:transparent}
.pw{position:relative}
.pw input{padding-right:46px}
#eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;border-radius:50%;background:transparent;border:0;color:var(--mut);cursor:pointer;font-size:13px}
button#go{width:100%;margin-top:18px;font:inherit;font-weight:600;padding:12px;border:0;border-radius:9px;background:var(--pri);color:var(--prit);cursor:pointer;border-bottom:3px solid var(--acc)}
button#go:disabled{opacity:.6;cursor:wait}
#le{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>

<main>
  <section class="card">
    <h1>Acesse sua conta</h1>
    <p class="sub">Entre com seu e-mail e senha.</p>
    <form id="f" autocomplete="on">
      <label for="em">E-mail</label>
      <input id="em" type="email" name="username" autocomplete="username" required>
      <label for="sn">Senha</label>
      <div class="pw">
        <input id="sn" type="password" name="password" autocomplete="current-password" required>
        <button type="button" id="eye" aria-label="Mostrar senha">👁</button>
      </div>
      <div id="le" role="alert"></div>
      <button id="go" type="submit">Entrar</button>
    </form>
  </section>
</main>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/db-adapter.js"></script>
<script>
  (function () {
    var f = document.getElementById('f'), go = document.getElementById('go'), msg = document.getElementById('le');
    var eye = document.getElementById('eye'), sn = document.getElementById('sn');
    eye.onclick = function () { sn.type = sn.type === 'password' ? 'text' : 'password'; };
    if (!window.bahiaDB) { msg.textContent = 'Banco não configurado. Avise o administrador.'; return; }
    if (!sessionStorage.getItem('bc_ida')) {
      window.bahiaDB.session().then(function (s) {
        if (s) { sessionStorage.setItem('bc_ida', '1'); location.replace('app.html'); }
      }).catch(function () {});
    }
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.textContent = '';
      go.disabled = true; go.textContent = 'Entrando...';
      window.bahiaDB.signIn(document.getElementById('em').value.trim(), sn.value)
        .then(function () { location.replace('app.html'); })
        .catch(function () {
          msg.textContent = 'E-mail ou senha incorretos.';
          go.disabled = false; go.textContent = 'Entrar';
        });
    });
  })();
</script>
</body>
</html>
