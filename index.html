<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>BahiaCred - Entrar</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:#0b1a4a;color:#10133a;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.stage{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#0b1a4a url(img/login-bg.jpg) 28% center/cover no-repeat}
.card{position:relative;width:100%;max-width:380px;background:#fff;border-radius:20px;padding:22px;box-shadow:0 20px 60px #0006;text-align:left}
.logo{display:block;width:78%;max-width:300px;margin:0 auto 6px}
h1{font-size:18px;margin:6px 0 2px;text-align:center;color:#020780}
.sub{color:#5d6290;font-size:13px;margin:0 0 12px;text-align:center}
label{display:block;font-size:13px;color:#5d6290;margin:10px 0 4px;font-weight:600}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid #cfd3ee;border-radius:10px;background:#fff;color:#10133a}
input:focus{outline:2px solid #020780;outline-offset:0;border-color:transparent}
.pw{position:relative}
.pw input{padding-right:46px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;border-radius:50%;background:transparent;border:0;color:#253061;cursor:pointer;font-size:14px}
.hide{display:none!important}
.lnk{display:block;margin:10px 0 0;width:auto;background:none;border:0;padding:0;color:#020780;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:right}
#le{color:#c0392b;font-size:13px;min-height:18px;margin-top:8px}
#ok{color:#1f8a4c;font-size:13px;min-height:18px;margin-top:8px}
button#go{width:100%;margin-top:14px;font:inherit;font-weight:700;padding:12px;border:0;border-radius:10px;background:linear-gradient(90deg,#fd7004,#ff9a3c);color:#fff;cursor:pointer;box-shadow:0 6px 16px #fd700455}
button#go:disabled{opacity:.6;cursor:wait}
.fone{margin-top:14px;text-align:center;color:#fff;font-size:14px;text-shadow:0 2px 8px #000}
.fone a{color:#fff;font-weight:700;text-decoration:none}
@media (min-width:820px){
  .stage{display:block;min-height:0;padding:0;width:min(100vw,198.8vh);aspect-ratio:1600/805;margin:0 auto;background-size:100% 100%}
  .card{position:absolute;left:71.06%;top:19.88%;width:23.69%;height:56.52%;max-width:none;border-radius:2.2cqw;padding:2.4% 2.2%;display:flex;flex-direction:column;justify-content:center;container-type:inline-size;font-size:1.05vw}
  .logo{width:72%;margin:0 auto 1.2%}
  h1{font-size:1.45em;margin:0 0 .2em}
  .sub{font-size:.95em;margin:0 0 .8em}
  label{font-size:.9em;margin:.7em 0 .3em}
  input{padding:.7em .9em;border-radius:.6em;font-size:1em}
  .eye{width:2.4em;height:2.4em;font-size:.95em}
  .lnk{font-size:.9em;margin-top:.5em}
  #le,#ok{font-size:.9em;min-height:1.2em;margin-top:.4em}
  button#go{font-size:1em;padding:.75em;margin-top:.8em;border-radius:.6em}
  .fone{display:none}
}
</style>
</head>
<body>
<div class="stage">
  <section class="card">
    <img class="logo" src="img/logo-card.png" alt="BahiaCred">
    <h1 id="ttl">Acesse sua conta</h1>
    <p class="sub" id="sub">Entre com seu e-mail e senha.</p>
    <form id="f" autocomplete="on">
      <div id="blkMail">
        <label for="em">E-mail</label>
        <input id="em" type="email" name="username" autocomplete="username">
      </div>
      <label for="sn" id="lblSn">Senha</label>
      <div class="pw">
        <input id="sn" type="password" name="password" autocomplete="current-password" required>
        <button type="button" class="eye" data-for="sn" aria-label="Mostrar senha">👁</button>
      </div>
      <div id="blkNew" class="hide">
        <label for="sn2">Repita a nova senha</label>
        <div class="pw">
          <input id="sn2" type="password" autocomplete="new-password">
          <button type="button" class="eye" data-for="sn2" aria-label="Mostrar senha">👁</button>
        </div>
      </div>
      <button type="button" id="forgot" class="lnk">Esqueci minha senha</button>
      <div id="le" role="alert"></div>
      <div id="ok" role="status"></div>
      <button id="go" type="submit">Entrar</button>
    </form>
  </section>
  <div class="fone">Conte com a gente! <a href="tel:+5571986277000">71 98627-7000</a></div>
</div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/db-adapter.js"></script>
<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var f = $('f'), go = $('go'), le = $('le'), okm = $('ok'), sn = $('sn'), sn2 = $('sn2');
    var recovery = /type=recovery/.test(location.hash);
    var mode = recovery ? 'new' : 'login';

    document.querySelectorAll('.eye').forEach(function (b) {
      b.onclick = function () {
        var i = $(b.getAttribute('data-for'));
        i.type = i.type === 'password' ? 'text' : 'password';
      };
    });

    function setMode(m) {
      mode = m;
      var isNew = m === 'new';
      $('blkMail').classList.toggle('hide', isNew || m === 'reset');
      $('blkNew').classList.toggle('hide', !isNew);
      $('lblSn').textContent = isNew ? 'Nova senha' : 'Senha';
      $('forgot').classList.toggle('hide', isNew);
      sn.required = m !== 'reset';
      $('sn').closest('.pw').classList.toggle('hide', m === 'reset');
      $('lblSn').classList.toggle('hide', m === 'reset');
      $('ttl').textContent = isNew ? 'Criar nova senha' : m === 'reset' ? 'Recuperar senha' : 'Acesse sua conta';
      $('sub').textContent = isNew ? 'Escolha uma senha com pelo menos 6 caracteres.' :
        m === 'reset' ? 'Enviaremos um link para o e-mail cadastrado.' : 'Entre com seu e-mail e senha.';
      go.textContent = isNew ? 'Salvar nova senha' : m === 'reset' ? 'Enviar link' : 'Entrar';
      $('forgot').textContent = m === 'reset' ? 'Voltar para o login' : 'Esqueci minha senha';
      le.textContent = ''; okm.textContent = '';
    }

    if (!window.bahiaDB) { le.textContent = 'Banco não configurado. Avise o administrador.'; return; }
    if (recovery) { setMode('new'); }
    else if (!sessionStorage.getItem('bc_ida')) {
      window.bahiaDB.session().then(function (s) {
        if (s) { sessionStorage.setItem('bc_ida', '1'); location.replace('app.html'); }
      }).catch(function () {});
    }

    $('forgot').onclick = function () {
      if (mode === 'reset') { setMode('login'); return; }
      setMode('reset');
    };

    f.addEventListener('submit', function (e) {
      e.preventDefault();
      le.textContent = ''; okm.textContent = '';
      if (mode === 'reset') {
        var mail = $('em').value.trim();
        if (!mail) { le.textContent = 'Digite o e-mail cadastrado.'; return; }
        go.disabled = true;
        window.bahiaDB.resetPassword(mail).then(function () {
          okm.textContent = 'Se o e-mail estiver cadastrado, você vai receber um link para criar a nova senha. Confira também a caixa de spam.';
        }).catch(function () {
          le.textContent = 'Não consegui enviar agora. Tente de novo em alguns minutos.';
        }).then(function () { go.disabled = false; });
        return;
      }
      if (mode === 'new') {
        if (sn.value.length < 6) { le.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
        if (sn.value !== sn2.value) { le.textContent = 'As senhas não conferem.'; return; }
        go.disabled = true;
        window.bahiaDB.updatePassword(sn.value).then(function () {
          location.replace('app.html');
        }).catch(function () {
          le.textContent = 'Não consegui salvar a senha. Peça um novo link.';
          go.disabled = false;
        });
        return;
      }
      go.disabled = true; go.textContent = 'Entrando...';
      window.bahiaDB.signIn($('em').value.trim(), sn.value)
        .then(function () { location.replace('app.html'); })
        .catch(function () {
          le.textContent = 'E-mail ou senha incorretos.';
          go.disabled = false; go.textContent = 'Entrar';
        });
    });
  })();
</script>
</body>
</html>
